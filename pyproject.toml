[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rio-criminalidade-historica"
version = "0.1.0"
description = "Pesquisa Histórica, Territorial e Antropológica da Criminalidade no Estado do Rio de Janeiro"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Equipe de Pesquisa Histórica e Engenharia de Dados" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Sociology :: History",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "SQLAlchemy>=2.0.30",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "folium>=0.16.0",
    "streamlit>=1.35.0",
    "beautifulsoup4>=4.12.0",
    "pypdf>=4.2.0",
    "pdfplumber>=0.11.0",
    "pytest>=8.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
